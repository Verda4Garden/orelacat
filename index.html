<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The icon set. Google shows the favicon beside a search result only if it
         can fetch one at a size it likes (a multiple of 48 px), so /icon-192.png
         and a real /favicon.ico both exist. The .ico matters: some crawlers look
         for that path alone and ignore these <link> tags, and a missing icon is
         what leaves a generic globe in the results. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The canonical origin. Every absolute URL on the site is built from this. -->
    <link rel="canonical" href="https://www.orelacat.my.id/" />

    <!-- Primary meta. Rewritten per page at build time by scripts/prerender.mjs;
         these values are the fallback for the home page. -->
    <title>Orelacat — Pemutar Musik Tanpa Iklan</title>
    <meta
      name="description"
      content="Orelacat: pemutar musik gratis tanpa iklan dengan dynamic island yang mengikuti lagumu. Ada di HP, tablet, dan desktop. Dukung komunitas lewat membership."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#060606" />
    <meta name="author" content="FahrillAS" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orelacat" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Orelacat — Pemutar Musik Tanpa Iklan" />
    <meta
      property="og:description"
      content="Pemutar musik gratis tanpa iklan dengan dynamic island yang mengikuti lagumu. HP, tablet, dan desktop."
    />
    <meta property="og:url" content="https://www.orelacat.my.id/" />
    <meta property="og:image" content="https://www.orelacat.my.id/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Orelacat — pemutar musik tanpa iklan" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orelacat — Pemutar Musik Tanpa Iklan" />
    <meta
      name="twitter:description"
      content="Pemutar musik gratis tanpa iklan dengan dynamic island yang mengikuti lagumu."
    />
    <meta name="twitter:image" content="https://www.orelacat.my.id/og-image.png" />

    <!-- Fonts are self-hosted. The two files the first paint needs are
         preloaded; the rest arrive with the stylesheet. Google Fonts used to
         sit here as a render-blocking request to two third-party origins. -->
    <link rel="preload" href="/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The version numbers on the page come from the update feed. Connecting
         early saves the TLS handshake when the fetch starts at hydration. -->
    <link rel="preconnect" href="https://orelacat-jam.orelacat.workers.dev" crossorigin />
  </head>
  <body>
    <!-- The prerendered markup goes inside #root, which is also what the client
         hydrates. Keeping it inside matters: React 19 hoists document-level
         resources it renders (the preload <link>s) to <body>, so markup written
         outside #root makes the hydrate target look different from the tree and
         React re-renders from scratch — doubling the page. -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
